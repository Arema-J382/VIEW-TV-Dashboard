<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>TV Dashboard - Laporan Sales (Full HD)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Mengunci ukuran layout pas Full HD 1920x1080 piksel */
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* Animasi Scrolling Berjalan dari Bawah ke Atas secara Looping Tanpa Batas */
    @keyframes scrollUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .animate-scroll-infinite {
      animation: scrollUp linear infinite;
    }
    
    .scroll-container:hover .animate-scroll-infinite {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="bg-slate-950 text-white flex flex-col font-sans select-none">

  <!-- ================= HEADER DASHBOARD ================= -->
  <header class="bg-slate-900 border-b border-slate-800 px-12 py-6 flex justify-between items-center shadow-md z-20">
    <div class="flex items-center gap-4">
      <div class="bg-blue-600 p-3.5 rounded-2xl text-white shadow-lg shadow-blue-600/30">
        <i data-lucide="tv" class="w-8 h-8"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-wide">INFORMA MOG MALANG (J382)</h1>
        <p class="text-sm text-blue-400 font-medium">LIVE TV DASHBOARD - LAPORAN SALES</p>
      </div>
    </div>
    
    <div class="flex items-center gap-8">
      <div class="text-right">
        <div id="currentTime" class="text-3xl font-mono font-bold text-slate-100">00:00:00</div>
        <div id="currentDate" class="text-sm text-slate-400">-</div>
      </div>
      <div class="bg-green-500/10 border border-green-500/20 text-green-400 px-5 py-2 rounded-full text-sm font-semibold flex items-center gap-2.5">
        <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
        LIVE SYNC ACTIVE
      </div>
    </div>
  </header>

  <!-- ================= SUB-HEADER STATISTIK & KONTROL ================= -->
  <div class="bg-slate-900/60 border-b border-slate-800/80 px-12 py-3.5 flex justify-between items-center text-sm text-slate-400 z-20">
    <div class="flex items-center gap-12">
      <span>Total Sales: <strong id="totalDataCount" class="text-white font-mono text-base">0</strong> Orang</span>
      <span>Akumulasi Penjualan: <strong id="totalSumSales" class="text-green-400 font-mono text-lg">Rp 0</strong></span>
    </div>
    <div class="flex items-center gap-3">
      <span>Kecepatan Scroll:</span>
      <input type="range" id="speedRange" min="10" max="80" value="35" class="accent-blue-500 cursor-pointer w-32">
      <span id="speedLabel" class="font-mono text-white w-10">35s</span>
    </div>
  </div>

  <!-- ================= MAIN VIEW ================= -->
  <main class="flex-1 relative overflow-hidden bg-slate-950 p-8 flex flex-col">
    <!-- Header Tabel Tetap (Tanpa Kolom Departemen) -->
    <div class="grid grid-cols-12 bg-slate-900 text-slate-300 font-bold text-base px-8 py-4 rounded-t-2xl border border-slate-800 shadow-xl z-10">
      <div class="col-span-2 text-center">FOTO / NIP</div>
      <div class="col-span-6">NAMA SALES</div>
      <div class="col-span-4 text-right">TOTAL PENJUALAN</div>
    </div>

    <!-- Area Status Kosong / Error -->
    <div id="emptyStatus" class="hidden absolute inset-0 pt-24 flex flex-col items-center justify-center z-20 bg-slate-950/80 backdrop-blur-sm">
      <i data-lucide="database-backup" class="w-20 h-20 text-slate-600 mb-4"></i>
      <div id="statusMessage" class="text-slate-400 text-lg font-medium">Belum ada data laporan sales di database.</div>
      <p class="text-slate-600 text-sm mt-2">Silakan input data melalui Admin Panel.</p>
    </div>

    <!-- Area Konten Berjalan Vertikal -->
    <div class="flex-1 overflow-hidden relative border-x border-b border-slate-800 rounded-b-2xl bg-slate-900/30 scroll-container shadow-inner">
      <div id="scrollWrapper" class="absolute w-full animate-scroll-infinite">
        <div id="tableContentOriginal" class="space-y-3 p-3"></div>
        <div id="tableContentClone" class="space-y-3 p-3" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://vxsopsnopeurnxdkfsbe.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4c29wc25vcGV1cm54ZGtmc2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzM4MjgsImV4cCI6MjEwOTE0OTgyOH0.53GRhBd5Pvjjcqbh4M9ok7HKfqJs7klyxPqomXMEzus'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let salesList = [];

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').innerText = now.toLocaleTimeString('id-ID');
      document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    const speedRange = document.getElementById('speedRange');
    const speedLabel = document.getElementById('speedLabel');
    const scrollWrapper = document.getElementById('scrollWrapper');

    speedRange.addEventListener('input', (e) => {
      const val = e.target.value;
      speedLabel.innerText = val + 's';
      scrollWrapper.style.animationDuration = val + 's';
    });
    scrollWrapper.style.animationDuration = '35s';

    async function fetchSalesData() {
      const emptyStatus = document.getElementById('emptyStatus');
      const statusMessage = document.getElementById('statusMessage');

      try {
        const { data, error } = await supabaseClient
          .from('laporan_sales')
          .select('*')
          .order('total', { ascending: false });

        if (error) {
          console.error('Gagal mengambil data:', error);
          emptyStatus.classList.remove('hidden');
          statusMessage.innerText = 'Gagal memuat data: ' + error.message;
          return;
        }

        if (data) {
          salesList = data;
          renderDashboard();
        }
      } catch (err) {
        console.error('Terjadi kesalahan:', err);
        emptyStatus.classList.remove('hidden');
        statusMessage.innerText = 'Terjadi kesalahan sistem.';
      }
    }

    function renderDashboard() {
      const origContainer = document.getElementById('tableContentOriginal');
      const cloneContainer = document.getElementById('tableContentClone');
      const totalDataCount = document.getElementById('totalDataCount');
      const totalSumSales = document.getElementById('totalSumSales');
      const emptyStatus = document.getElementById('emptyStatus');

      totalDataCount.innerText = salesList.length;

      let sumTotal = salesList.reduce((acc, curr) => acc + (Number(curr.total) || 0), 0);
      totalSumSales.innerText = 'Rp ' + sumTotal.toLocaleString('id-ID');

      if (salesList.length === 0) {
        emptyStatus.classList.remove('hidden');
        origContainer.innerHTML = '';
        cloneContainer.innerHTML = '';
        return;
      }

      emptyStatus.classList.add('hidden');

      let htmlRows = '';
      salesList.forEach((item) => {
        const bucketName = 'FOTO SALES';
        const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/${encodeURIComponent(bucketName)}/${item.nip}.jpg`;
        const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(item.nama)}&background=0D8ABC&color=fff&size=128`;

        htmlRows += `
          <div class="grid grid-cols-12 items-center bg-slate-900/80 hover:bg-slate-800/90 border border-slate-800/80 rounded-2xl px-8 py-4 transition shadow-sm">
            <div class="col-span-2 flex items-center justify-center">
              <div class="relative w-14 h-14 rounded-full overflow-hidden border-2 border-blue-500/50 bg-slate-800 shrink-0 shadow">
                <img src="${imageUrl}" alt="${item.nama}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='${fallbackAvatar}';">
              </div>
            </div>
            <div class="col-span-6 pl-4">
              <div class="font-bold text-white text-lg tracking-wide">${item.nama}</div>
              <div class="text-xs font-mono text-blue-400 mt-0.5">NIP: ${item.nip}</div>
            </div>
            <div class="col-span-4 text-right font-mono font-bold text-green-400 text-xl">
              Rp ${Number(item.total).toLocaleString('id-ID')}
            </div>
          </div>
        `;
      });

      origContainer.innerHTML = htmlRows;
      cloneContainer.innerHTML = htmlRows;

      const dynamicSpeed = Math.max(20, salesList.length * 3.5);
      speedRange.value = dynamicSpeed;
      speedLabel.innerText = dynamicSpeed + 's';
      scrollWrapper.style.animationDuration = dynamicSpeed + 's';
    }

    function setupRealtime() {
      supabaseClient
        .channel('public:laporan_sales')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'laporan_sales' }, () => {
          fetchSalesData();
        })
        .subscribe();
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      fetchSalesData();
      setupRealtime();
    });
  </script>
</body>
</html>
