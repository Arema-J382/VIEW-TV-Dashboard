<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>TV Dashboard - Laporan Sales (Full HD Layout Custom)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Mengunci ukuran layout pas Full HD 1920x1080 piksel */
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* ==========================================================================
       [PENGATURAN AREA TABEL] 
       ========================================================================== */
    .custom-table-container {
      width: 40%;               /* Ditingkatkan sedikit agar muat dengan foto lebih besar & nomor */
      max-width: 1200px;
      height: 600px;            
      margin-left: auto;        
      margin-right: auto;
      margin-top: 10px;         
      margin-bottom: 0px;       
    }

    /* Animasi Scrolling Berjalan dari Bawah ke Atas secara Looping Tanpa Batas */
    @keyframes scrollUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .animate-scroll-infinite {
      animation: scrollUp linear infinite;
    }
    
    .scroll-container:hover .animate-scroll-infinite {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="bg-slate-950 text-white flex flex-col font-sans select-none">

  <!-- ================= HEADER DASHBOARD ================= -->
  <header class="bg-slate-900 border-b border-slate-800 px-12 py-5 flex justify-between items-center shadow-md z-20 shrink-0">
    <div class="flex items-center gap-4">
      <div class="bg-blue-600 p-3 rounded-2xl text-white shadow-lg shadow-blue-600/30">
        <i data-lucide="tv" class="w-7 h-7"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-wide">INFORMA MOG MALANG (J382)</h1>
        <p class="text-xs text-blue-400 font-medium">LIVE TV DASHBOARD - LAPORAN SALES</p>
      </div>
    </div>
    
    <div class="flex items-center gap-8">
      <div class="text-right">
        <div id="currentTime" class="text-3xl font-mono font-bold text-slate-100">00:00:00</div>
        <div id="currentDate" class="text-xs text-slate-400">-</div>
      </div>
      <div class="bg-green-500/10 border border-green-500/20 text-green-400 px-4 py-2 rounded-full text-xs font-semibold flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
        LIVE SYNC ACTIVE
      </div>
    </div>
  </header>

  <!-- ================= SUB-HEADER STATISTIK ================= -->
  <div class="bg-slate-900/60 border-b border-slate-800/80 px-12 py-3 flex justify-between items-center text-xs text-slate-400 z-20 shrink-0">
    <div class="flex items-center gap-10">
      <span>Total Sales: <strong id="totalDataCount" class="text-white font-mono text-sm">0</strong> Orang</span>
      <span>Akumulasi Penjualan: <strong id="totalSumSales" class="text-green-400 font-mono text-base">Rp 0</strong></span>
    </div>
  </div>

  <!-- ================= MAIN VIEW (KONTEN UTAMA) ================= -->
  <main class="flex-1 relative overflow-hidden bg-slate-950 p-6 flex flex-col">
    
    <!-- AREA TABEL LAPORAN SALES -->
    <div class="custom-table-container flex flex-col relative z-10">
      
      <!-- Header Tabel (LIVE TOP SALES TODAY) -->
      <div class="bg-white text-slate-800 font-extrabold text-center text-lg py-3 rounded-t-xl border-b-2 border-slate-200 shadow-md z-10 shrink-0 tracking-wider">
        LIVE TOP SALES TODAY
      </div>

      <!-- Header Kolom Tabel -->
      <div class="grid grid-cols-12 bg-slate-100 text-slate-700 font-bold text-sm px-6 py-2.5 border-b border-slate-200 z-10 shrink-0">
        <div class="col-span-4 text-center">NO / FOTO / NIP</div>
        <div class="col-span-4 flex items-center">NAMA SALES</div>
        <div class="col-span-4 text-right flex items-center justify-end">TOTAL PENJUALAN</div>
      </div>

      <!-- Area Status Kosong / Error -->
      <div id="emptyStatus" class="hidden absolute inset-0 pt-16 flex flex-col items-center justify-center z-20 bg-white/90 backdrop-blur-sm rounded-b-xl">
        <i data-lucide="database-backup" class="w-16 h-16 text-slate-400 mb-3"></i>
        <div id="statusMessage" class="text-slate-600 text-base font-medium">Belum ada data laporan sales di database.</div>
        <p class="text-slate-400 text-xs mt-1">Silakan input data melalui Admin Panel.</p>
      </div>

      <!-- Area Konten Berjalan Vertikal (Background Putih) -->
      <div class="flex-1 overflow-hidden relative border-x border-b border-slate-200 rounded-b-xl bg-white scroll-container shadow-inner">
        <div id="scrollWrapper" class="absolute w-full animate-scroll-infinite">
          <div id="tableContentOriginal" class="space-y-2 p-2"></div>
          <div id="tableContentClone" class="space-y-2 p-2" aria-hidden="true"></div>
        </div>
      </div>

    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://vxsopsnopeurnxdkfsbe.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4c29wc25vcGV1cm54ZGtmc2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzM4MjgsImV4cCI6MjEwOTE0OTgyOH0.53GRhBd5Pvjjcqbh4M9ok7HKfqJs7klyxPqomXMEzus'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let salesList = [];

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').innerText = now.toLocaleTimeString('id-ID');
      document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    const scrollWrapper = document.getElementById('scrollWrapper');
    // Penguncian Kecepatan Scroll ke 100 Detik
    scrollWrapper.style.animationDuration = '100s';

    async function fetchSalesData() {
      const emptyStatus = document.getElementById('emptyStatus');
      const statusMessage = document.getElementById('statusMessage');

      try {
        const { data, error } = await supabaseClient
          .from('laporan_sales')
          .select('*')
          .order('total', { ascending: false });

        if (error) {
          console.error('Gagal mengambil data:', error);
          emptyStatus.classList.remove('hidden');
          statusMessage.innerText = 'Gagal memuat data: ' + error.message;
          return;
        }

        if (data) {
          salesList = data;
          renderDashboard();
        }
      } catch (err) {
        console.error('Terjadi kesalahan:', err);
        emptyStatus.classList.remove('hidden');
        statusMessage.innerText = 'Terjadi kesalahan sistem.';
      }
    }

    function renderDashboard() {
      const origContainer = document.getElementById('tableContentOriginal');
      const cloneContainer = document.getElementById('tableContentClone');
      const totalDataCount = document.getElementById('totalDataCount');
      const totalSumSales = document.getElementById('totalSumSales');
      const emptyStatus = document.getElementById('emptyStatus');

      totalDataCount.innerText = salesList.length;

      let sumTotal = salesList.reduce((acc, curr) => acc + (Number(curr.total) || 0), 0);
      totalSumSales.innerText = 'Rp ' + sumTotal.toLocaleString('id-ID');

      if (salesList.length === 0) {
        emptyStatus.classList.remove('hidden');
        origContainer.innerHTML = '';
        cloneContainer.innerHTML = '';
        return;
      }

      emptyStatus.classList.add('hidden');

      let htmlRows = '';
      salesList.forEach((item, index) => {
        const bucketName = 'FOTO SALES';
        const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/${encodeURIComponent(bucketName)}/${item.nip}.jpg`;
        const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(item.nama)}&background=0D8ABC&color=fff&size=128`;

        htmlRows += `
          <div class="grid grid-cols-12 items-center bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 transition shadow-sm">
            <div class="col-span-4 flex items-center justify-center gap-3">
              <!-- Nomor Urut -->
              <span class="font-extrabold text-lg text-slate-700 w-6 text-right">${index + 1}.</span>
              <!-- Foto Kotak dan Lebih Besar (w-16 h-16 / 64px) -->
              <div class="relative w-16 h-16 rounded-lg overflow-hidden border-2 border-blue-500 bg-slate-200 shrink-0 shadow-md">
                <img src="${imageUrl}" alt="${item.nama}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='${fallbackAvatar}';">
              </div>
            </div>
            <div class="col-span-4 pl-2">
              <div class="font-bold text-slate-900 text-base tracking-wide">${item.nama}</div>
              <div class="text-xs font-mono text-blue-600 font-semibold mt-0.5">NIP: ${item.nip}</div>
            </div>
            <div class="col-span-4 text-right font-mono font-bold text-emerald-600 text-lg">
              Rp ${Number(item.total).toLocaleString('id-ID')}
            </div>
          </div>
        `;
      });

      origContainer.innerHTML = htmlRows;
      cloneContainer.innerHTML = htmlRows;

      // Tetap dikunci pada kecepatan 100s
      scrollWrapper.style.animationDuration = '100s';
    }

    function setupRealtime() {
      supabaseClient
        .channel('public:laporan_sales')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'laporan_sales' }, () => {
          fetchSalesData();
        })
        .subscribe();
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      fetchSalesData();
      setupRealtime();
    });
  </script>
</body>
</html>
