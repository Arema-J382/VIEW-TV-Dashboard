<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>TV Dashboard - Laporan Sales & Gauge (Full HD Layout Custom)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Mengunci ukuran layout pas Full HD 1920x1080 piksel */
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* CONTAINER UTAMA SIDE-BY-SIDE */
    .dashboard-grid {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      width: 100%;
      height: 100%;
    }

    /* AREA GAUGE CHART (DI SEBELAH KIRI) */
    .gauge-section-container {
      width: 550px;
      height: 520px;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid #bfdbfe;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    /* AREA TABEL TOP DAILY SALES (DI SEBELAH KANAN) */
    .custom-table-container {
      width: 650px;               
      height: 520px;            
      margin: 0;         
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
    }

    /* Animasi Scrolling */
    @keyframes scrollUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .animate-scroll-infinite {
      animation: scrollUp linear infinite;
    }
    
    .scroll-container:hover .animate-scroll-infinite {
      animation-play-state: paused;
    }

    /* OUTLINE PUTIH TIPIS PADA TEKS KHUSUS TOP 3 */
    .text-outline-white {
      text-shadow: 
        -0.75px -0.75px 0 #fff,  
         0.75px -0.75px 0 #fff,
        -0.75px  0.75px 0 #fff,
         0.75px  0.75px 0 #fff,
         0px     1px    2px rgba(0, 0, 0, 0.12);
    }

    /* EFEK API / GLOW DI BAGIAN LUAR (OUTLINE) UNTUK TOP 3 */
    @keyframes goldGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(234, 179, 8, 0.5), 0 0 16px rgba(245, 158, 11, 0.3); }
      50% { box-shadow: 0 0 16px rgba(234, 179, 8, 0.9), 0 0 24px rgba(239, 68, 68, 0.6); }
    }

    @keyframes silverGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(148, 163, 184, 0.5), 0 0 16px rgba(56, 189, 248, 0.3); }
      50% { box-shadow: 0 0 16px rgba(148, 163, 184, 0.9), 0 0 24px rgba(56, 189, 248, 0.6); }
    }

    @keyframes bronzeGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(217, 119, 6, 0.5), 0 0 16px rgba(234, 88, 12, 0.3); }
      50% { box-shadow: 0 0 16px rgba(217, 119, 6, 0.9), 0 0 24px rgba(220, 38, 38, 0.6); }
    }

    .fire-box-1 {
      background-color: #fefce8;
      border: 2px solid #eab308;
      border-radius: 0.75rem;
      animation: goldGlow 1.8s infinite ease-in-out;
    }

    .fire-box-2 {
      background-color: #f8fafc;
      border: 2px solid #94a3b8;
      border-radius: 0.75rem;
      animation: silverGlow 2.2s infinite ease-in-out;
    }

    .fire-box-3 {
      background-color: #fff7ed;
      border: 2px solid #d97706;
      border-radius: 0.75rem;
      animation: bronzeGlow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-blue-50 text-slate-800 flex flex-col font-sans select-none">

  <!-- ================= HEADER DASHBOARD ================= -->
  <header class="bg-slate-900 border-b border-slate-800 px-12 py-5 flex justify-between items-center shadow-md z-20 shrink-0 text-white">
    <div class="flex items-center gap-4">
      <div class="bg-blue-600 p-3 rounded-2xl text-white shadow-lg shadow-blue-600/30">
        <i data-lucide="tv" class="w-7 h-7"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-wide">INFORMA MOG MALANG (J382)</h1>
        <p class="text-xs text-blue-400 font-medium">LIVE TV DASHBOARD - LAPORAN SALES</p>
      </div>
    </div>
    
    <div class="flex items-center gap-8">
      <div class="text-right">
        <div id="currentTime" class="text-3xl font-mono font-bold text-slate-100">00:00:00</div>
        <div id="currentDate" class="text-xs text-slate-400">-</div>
      </div>
      <div class="bg-green-500/10 border border-green-500/20 text-green-400 px-4 py-2 rounded-full text-xs font-semibold flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
        LIVE SYNC ACTIVE
      </div>
    </div>
  </header>

  <!-- ================= SUB-HEADER STATISTIK ================= -->
  <div class="bg-slate-900/90 border-b border-slate-800 px-12 py-3 flex justify-between items-center text-xs text-slate-300 z-20 shrink-0">
    <div class="flex items-center gap-10">
      <span>Total Sales: <strong id="totalDataCount" class="text-white font-mono text-sm">0</strong> Orang</span>
      <span>Akumulasi Penjualan Sales: <strong id="totalSumSales" class="text-green-400 font-mono text-base">Rp 0</strong></span>
    </div>
  </div>

  <!-- ================= MAIN VIEW (KONTEN UTAMA) ================= -->
  <main class="flex-1 relative overflow-hidden bg-blue-50 p-6 flex items-center justify-center">
    
    <!-- CONTAINER UTAMA SIDE-BY-SIDE -->
    <div class="dashboard-grid">

      <!-- ================= GAUGE CHART SECTION ================= -->
      <div id="gaugeContainer" class="gauge-section-container">
        
        <!-- Header Gauge -->
        <div class="bg-slate-900 text-white font-extrabold text-center text-2xl py-3.5 border-b border-slate-800 shadow-md tracking-wider">
          TARGET TODAY
        </div>

        <!-- Konten Grafik Gauge -->
        <div class="flex-1 flex flex-col items-center justify-center p-6 relative bg-gradient-to-b from-slate-50 to-white">
          
          <!-- SVG Gauge Semi-Circle dengan Persentase di Dalam Garis Arc & Tanpa Teks Tengah -->
          <div class="relative w-80 h-40 flex items-center justify-center mt-2">
            <svg class="w-full h-full overflow-visible" viewBox="0 0 200 100">
              <defs>
                <!-- Path khusus untuk penempatan teks persentase terisi secara melengkung -->
                <path id="textArcAchieved" d="M 20 90 A 80 80 0 0 1 180 90" />
              </defs>

              <!-- Background Track Arc (Sisa Kekurangan / Belum Terisi) -->
              <path id="gaugeBackgroundArc" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#cbd5e1" stroke-width="26" stroke-linecap="round"/>
              
              <!-- Dynamic Progress Arc (Pencapaian / Terisi) -->
              <path id="gaugeProgressArc" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#3b82f6" stroke-width="26" stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="251.2" style="transition: stroke-dashoffset 1s ease-in-out, stroke 0.5s ease;"/>
              
              <!-- Teks Persentase TERISI di dalam Arc -->
              <text dy="4.5" fill="#ffffff" font-size="9.5" font-weight="900" font-family="monospace">
                <textPath id="gaugeTextAchieved" href="#textArcAchieved" startOffset="0%" text-anchor="start" style="transition: startOffset 1s ease-in-out;">
                  0.0%
                </textPath>
              </text>

              <!-- Jarum Penunjuk (Needle) dengan Animasi Rotasi -->
              <g id="gaugeNeedle" style="transform-origin: 100px 90px; transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1); transform: rotate(-90deg);">
                <line x1="100" y1="90" x2="100" y2="24" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
                <circle cx="100" cy="90" r="7.5" fill="#0f172a"/>
                <circle cx="100" cy="90" r="3" fill="#ffffff"/>
              </g>
            </svg>
          </div>

          <!-- Keterangan Nilai Realtime vs Target -->
          <div class="w-full grid grid-cols-2 gap-4 mt-8 bg-slate-100 p-4 rounded-xl border border-slate-200 shadow-inner">
            <div class="text-center border-r border-slate-200 pr-2">
              <div class="text-xl text-slate-500 font-bold uppercase">Realisasi</div>
              <div id="gaugeRealtimeValue" class="text-2xl font-extrabold font-mono text-emerald-600 mt-1">Rp 0</div>
            </div>
            <div class="text-center pl-2">
              <div class="text-xl text-slate-500 font-bold uppercase">Target Today</div>
              <div id="gaugeTargetValue" class="text-2xl font-extrabold font-mono text-red-600 mt-1">Rp 0</div>
            </div>
          </div>

        </div>
      </div>
      <!-- ================= AKHIR GAUGE CHART SECTION ================= -->


      <!-- ================= AREA TABEL LAPORAN SALES ================= -->
      <div class="custom-table-container flex flex-col relative z-10">
        
        <!-- Header Tabel -->
        <div class="bg-slate-900 text-white font-extrabold text-center text-2xl py-3.5 rounded-t-xl border-b border-slate-800 shadow-md z-10 shrink-0 tracking-wider">
          LIVE TOP SALES TODAY
        </div>

        <!-- Area Status Kosong / Error -->
        <div id="emptyStatus" class="hidden absolute inset-0 pt-16 flex flex-col items-center justify-center z-20 bg-white/90 backdrop-blur-sm rounded-b-xl">
          <i data-lucide="database-backup" class="w-16 h-16 text-slate-400 mb-3"></i>
          <div id="statusMessage" class="text-slate-600 text-base font-medium">Belum ada data laporan sales di database.</div>
          <p class="text-slate-400 text-xs mt-1">Silakan input data melalui Admin Panel.</p>
        </div>

        <!-- Area Konten Berjalan Vertikal -->
        <div class="flex-1 overflow-hidden relative border-x border-b border-blue-200 rounded-b-xl bg-white scroll-container shadow-lg">
          <div id="scrollWrapper" class="absolute w-full animate-scroll-infinite">
            <div id="tableContentOriginal" class="space-y-3 p-3"></div>
            <div id="tableContentClone" class="space-y-3 p-3" aria-hidden="true"></div>
          </div>
        </div>

      </div>
      <!-- ================= AKHIR TABEL TOP DAILY SALES ================= -->

    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://vxsopsnopeurnxdkfsbe.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4c29wc25vcGV1cm54dktmc2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzM4MjgsImV4cCI6MjEwOTE0OTgyOH0.53GRhBd5Pvjjcqbh4M9ok7HKfqJs7klyxPqomXMEzus'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let salesList = [];

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').innerText = now.toLocaleTimeString('id-ID');
      document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    const scrollWrapper = document.getElementById('scrollWrapper');
    scrollWrapper.style.animationDuration = '100s';

    // 1. Fetch & Render Top Sales Data
    async function fetchSalesData() {
      const emptyStatus = document.getElementById('emptyStatus');
      const statusMessage = document.getElementById('statusMessage');

      try {
        const { data, error } = await supabaseClient
          .from('laporan_sales')
          .select('*')
          .order('total', { ascending: false });

        if (error) {
          console.error('Gagal mengambil data sales:', error);
          emptyStatus.classList.remove('hidden');
          statusMessage.innerText = 'Gagal memuat data: ' + error.message;
          return;
        }

        if (data) {
          salesList = data;
          renderDashboard();
        }
      } catch (err) {
        console.error('Terjadi kesalahan:', err);
        emptyStatus.classList.remove('hidden');
        statusMessage.innerText = 'Terjadi kesalahan sistem.';
      }
    }

    function renderDashboard() {
      const origContainer = document.getElementById('tableContentOriginal');
      const cloneContainer = document.getElementById('tableContentClone');
      const totalDataCount = document.getElementById('totalDataCount');
      const totalSumSales = document.getElementById('totalSumSales');
      const emptyStatus = document.getElementById('emptyStatus');

      totalDataCount.innerText = salesList.length;

      let sumTotal = salesList.reduce((acc, curr) => acc + (Number(curr.total) || 0), 0);
      totalSumSales.innerText = 'Rp ' + sumTotal.toLocaleString('id-ID');

      if (salesList.length === 0) {
        emptyStatus.classList.remove('hidden');
        origContainer.innerHTML = '';
        cloneContainer.innerHTML = '';
        return;
      }

      emptyStatus.classList.add('hidden');

      let htmlRows = '';
      salesList.forEach((item, index) => {
        const rank = index + 1;
        const bucketName = 'FOTO SALES';
        const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/${encodeURIComponent(bucketName)}/${item.nip}.jpg`;
        const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(item.nama)}&background=0D8ABC&color=fff&size=128`;

        let rowClass = "bg-slate-50 border border-slate-200 hover:bg-slate-100 rounded-xl";
        let crownMarkup = "";
        let borderPhotoStyle = "border-blue-500";
        let textEffectClass = "";
        let numberStyle = "text-slate-700";

        if (rank === 1) {
          rowClass = "fire-box-1";
          borderPhotoStyle = "border-yellow-500 shadow-yellow-300";
          textEffectClass = "text-outline-white font-bold";
          numberStyle = "text-outline-white font-extrabold text-xl";
          crownMarkup = `
            <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 z-20 text-yellow-500 drop-shadow-[0_2px_4px_rgba(234,179,8,0.8)]">
              <i data-lucide="crown" class="w-6 h-6 fill-yellow-400"></i>
            </div>`;
        } else if (rank === 2) {
          rowClass = "fire-box-2";
          borderPhotoStyle = "border-slate-400 shadow-slate-300";
          textEffectClass = "text-outline-white font-bold";
          numberStyle = "text-outline-white font-extrabold text-xl";
          crownMarkup = `
            <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 z-20 text-slate-400 drop-shadow-[0_2px_4px_rgba(148,163,184,0.8)]">
              <i data-lucide="crown" class="w-6 h-6 fill-slate-300"></i>
            </div>`;
        } else if (rank === 3) {
          rowClass = "fire-box-3";
          borderPhotoStyle = "border-amber-600 shadow-amber-300";
          textEffectClass = "text-outline-white font-bold";
          numberStyle = "text-outline-white font-extrabold text-xl";
          crownMarkup = `
            <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 z-20 text-amber-600 drop-shadow-[0_2px_4px_rgba(217,119,6,0.8)]">
              <i data-lucide="crown" class="w-6 h-6 fill-amber-500"></i>
            </div>`;
        }

        htmlRows += `
          <div class="grid grid-cols-12 items-center px-4 py-3 transition shadow-sm ${rowClass}">
            <div class="col-span-4 flex items-center justify-center gap-3">
              <span class="font-bold text-lg w-6 text-right ${numberStyle}">${rank}.</span>
              <div class="relative w-16 h-16 rounded-lg border-2 ${borderPhotoStyle} bg-slate-200 shrink-0 shadow-md">
                ${crownMarkup}
                <div class="w-full h-full rounded-[6px] overflow-hidden relative z-10">
                  <img src="${imageUrl}" alt="${item.nama}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='${fallbackAvatar}';">
                </div>
              </div>
            </div>
            <div class="col-span-4 pl-2">
              <div class="text-slate-900 text-base tracking-wide ${textEffectClass}">${item.nama}</div>
              <div class="text-xs font-mono text-blue-600 font-semibold mt-0.5 ${textEffectClass}">NIP: ${item.nip}</div>
            </div>
            <div class="col-span-4 text-right font-mono font-bold text-emerald-600 text-lg ${textEffectClass}">
              Rp ${Number(item.total).toLocaleString('id-ID')}
            </div>
          </div>
        `;
      });

      origContainer.innerHTML = htmlRows;
      cloneContainer.innerHTML = htmlRows;

      lucide.createIcons();
      scrollWrapper.style.animationDuration = '100s';
    }


    // 2. Fetch & Compute Realtime Gauge Chart Data
    async function updateGaugeData() {
      try {
        // A. Ambil Target dari tabel 'target_today'
        const { data: targetData, error: targetError } = await supabaseClient
          .from('target_today')
          .select('*');

        let targetValue = 0;
        if (!targetError && targetData && targetData.length > 0) {
          targetData.forEach(row => {
            const keys = Object.keys(row);
            let val = 0;
            if (row.target !== undefined) val = Number(row.target) || 0;
            else if (row.nilai !== undefined) val = Number(row.nilai) || 0;
            else if (row.jumlah !== undefined) val = Number(row.jumlah) || 0;
            else if (keys.length > 0) {
              for (let k of keys) {
                if (!isNaN(Number(row[k])) && Number(row[k]) > 0) {
                  val = Number(row[k]) || 0;
                  break;
                }
              }
            }
            targetValue += val;
          });
        }
        if (targetValue <= 0) targetValue = 250000000; // Fallback default target

        // B. Ambil Realtime Sales dari tabel 'laporan_departemen'
        const { data: deptData, error: deptError } = await supabaseClient
          .from('laporan_departemen')
          .select('*');

        if (deptError) {
          console.error('Gagal mengambil laporan_departemen:', deptError);
        }

        let realtimeSumExcludePpn = 0;
        if (!deptError && deptData && deptData.length > 0) {
          deptData.forEach(row => {
            const keys = Object.keys(row);
            const matchingKey = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === 'excludeppn');
            
            let val = 0;
            if (matchingKey && row[matchingKey] !== undefined) {
              val = Number(row[matchingKey]) || 0;
            } else if (row.exclude_ppn !== undefined) {
              val = Number(row.exclude_ppn) || 0;
            } else if (keys.length >= 5) {
              val = Number(row[keys[4]]) || 0;
            }
            realtimeSumExcludePpn += val;
          });
        }

        // C. Hitung Persentase & Render Gauge
        const percentage = targetValue > 0 ? (realtimeSumExcludePpn / targetValue) * 100 : 0;
        const clampedPercent = Math.min(Math.max(percentage, 0), 100);
        
        const maxDash = 251.2;
        const dashOffset = maxDash - (clampedPercent / 100) * maxDash;

        document.getElementById('gaugeProgressArc').style.strokeDashoffset = dashOffset;
        
        // Rotasi Jarum
        const needleRotation = -90 + (clampedPercent / 100) * 180;
        document.getElementById('gaugeNeedle').style.transform = `rotate(${needleRotation}deg)`;

        // Pembaruan Teks Persentase Tercapai di Dalam Garis Gauge
        const textAchieved = document.getElementById('gaugeTextAchieved');

        if (clampedPercent > 8) {
          textAchieved.textContent = percentage.toFixed(1) + '%';
          textAchieved.setAttribute('startOffset', Math.max(2, (clampedPercent / 2) - 4) + '%');
        } else {
          textAchieved.textContent = ''; // Sembunyikan jika area biru terlalu pendek
        }

        document.getElementById('gaugeRealtimeValue').innerText = 'Rp ' + realtimeSumExcludePpn.toLocaleString('id-ID');
        document.getElementById('gaugeTargetValue').innerText = 'Rp ' + targetValue.toLocaleString('id-ID');

        // Ubah warna indikator berdasarkan pencapaian
        const arcElement = document.getElementById('gaugeProgressArc');
        if (percentage >= 100) {
          arcElement.style.stroke = '#10b981'; // Hijau
        } else if (percentage >= 75) {
          arcElement.style.stroke = '#3b82f6'; // Biru
        } else {
          arcElement.style.stroke = '#f59e0b'; // Amber
        }

      } catch (err) {
        console.error('Gagal memperbarui gauge:', err);
      }
    }


    // 3. Setup Supabase Realtime Sync Channels
    function setupRealtime() {
      supabaseClient
        .channel('public:laporan_sales')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'laporan_sales' }, () => {
          fetchSalesData();
        })
        .subscribe();

      supabaseClient
        .channel('public:gauge_sync_channels')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'laporan_departemen' }, () => {
          updateGaugeData();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'target_today' }, () => {
          updateGaugeData();
        })
        .subscribe();
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      fetchSalesData();
      updateGaugeData();
      setupRealtime();
    });
  </script>
</body>
</html>
